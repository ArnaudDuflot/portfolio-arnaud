  <text x="80" y="555" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#B5C0B5">Currently scaling HelloBible · 15k to 140k downloads in 14 months</text>
  <text x="80" y="582" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#6B7566">portfolio-arnaud.pages.dev</text>
