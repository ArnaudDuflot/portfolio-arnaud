<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg1" cx="85%" cy="-5%" r="65%">
      <stop offset="0%" stop-color="#73B392" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A1410" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg2" cx="-12%" cy="110%" r="75%">
      <stop offset="0%" stop-color="#2D5F3F" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5A9975" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A1410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73B392"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A1410"/>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Eyebrow -->
  <text x="80" y="135" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#73B392" letter-spacing="3">PRODUCT OPS  ·  AI AUTOMATION</text>

  <!-- Wordmark -->
  <g>
    <text x="80" y="245" font-family="Fraunces, Georgia, serif" font-size="68" font-weight="500" fill="#F2EFE8" letter-spacing="-2">Arnaud Duflot</text>
    <circle cx="555" cy="225" r="9" fill="#73B392"/>
  </g>

  <!-- Tagline -->
  <text x="80" y="365" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="500" fill="#F2EFE8" letter-spacing="-1.5">I take <tspan font-style="italic" fill="url(#accent)">50-minute manual processes</tspan></text>
  <text x="80" y="425" font-family="Fraunces, Georgia, serif" font-size="48" font-weight="500" fill="#F2EFE8" letter-spacing="-1.5">and turn them into one-command pipelines.</text>

